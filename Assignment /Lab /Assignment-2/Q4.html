<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form>
        <label for="name" style="display: inline-block; width: 100px;">
            Full Name:
        </label>
        <input type="text" id="name" name="name">
        <br><br>

        <label for="email" style="display: inline-block; width: 100px;">
            Email:
        </label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="password" style="display: inline-block; width: 100px;">
            Password:
        </label>
        <input type="password" id="password" name="password">
        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br><br>

        <label>Hobbies:</label>

        <input type="checkbox" id="coding" name="hobby" value="coding">
        <label for="coding">Coding</label>

        <input type="checkbox" id="sports" name="hobby" value="sports">
        <label for="sports">Sports</label>

        <input type="checkbox" id="music" name="hobby" value="music">
        <label for="music">Music</label>

        <br><br>

        <label for="course">Select Course:</label>

        <select id="course" name="course">
            <option value="">--Select Course--</option>
            <option value="cse">Computer Science</option>
            <option value="ece">Electronics</option>
            <option value="me">Mechanical</option>
            <option value="ce">Civil</option>
        </select>

        <br><br>
        
        <input type="submit" value="Register">
    </form>
</body>
</html>
